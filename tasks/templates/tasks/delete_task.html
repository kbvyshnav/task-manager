{% extends 'tasks/base.html' %}

{% block title %}
Delete Task
{% endblock %}

{% block content %}

<h1>Delete Task</h1>

<p>
Are you sure you want to delete:
<strong>{{ task.title }}</strong> ?
</p>

<form method="POST">

    {% csrf_token %}

    <button type="submit">
        Confirm Delete
    </button>

    <a href="{% url 'task_list' %}">
        Cancel
    </a>

</form>

{% endblock %}
